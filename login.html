<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIFELINE-X | Authentication</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #080808; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; overflow: hidden; }
        
        .login-container { background-color: #121212; border: 1px solid #00ff6644; box-shadow: 0 0 30px rgba(0, 255, 102, 0.15); border-radius: 16px; padding: 40px; width: 100%; max-width: 420px; text-align: center; z-index: 2; }
        .project-logo-img { max-width: 200px; height: auto; margin-bottom: 15px; }
        .subtitle { font-size: 0.85rem; color: #888; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 30px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .input-group input { width: 100%; padding: 12px 16px; background-color: #0a0a0a; border: 1px solid #222; border-radius: 8px; color: #00ff66; font-size: 1rem; outline: none; transition: all 0.3s ease; }
        .input-group input:focus { border-color: #00ff66; box-shadow: 0 0 10px #00ff6644; }
        
        .login-btn { width: 100%; padding: 14px; background-color: #00ff66; color: #000; font-size: 1rem; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; letter-spacing: 1.5px; text-transform: uppercase; box-shadow: 0 0 15px #00ff6666; transition: all 0.3s ease; margin-top: 10px; }
        .login-btn:hover { background-color: #00cc52; box-shadow: 0 0 25px #00ff66aa; transform: translateY(-2px); }
        
        .team-footer { position: absolute; bottom: 25px; right: 30px; display: flex; align-items: center; gap: 12px; z-index: 2; }
        .team-logo-img { width: 45px; height: 45px; border-radius: 50%; border: 1px solid #00ff6666; object-fit: cover; background-color: #121212; }
        .team-badge-fallback { width: 45px; height: 45px; border-radius: 50%; border: 1px solid #00ff6666; background-color: #121212; display: none; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; color: #00ff66; text-shadow: 0 0 5px #00ff6688; }
        .team-name { font-size: 0.85rem; color: #666; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="login-container">
        <img src="c:\Users\salma\Downloads\lx-removebg-preview.png" class="project-logo-img">
        <div class="subtitle">Space Medical Telemetry Access</div>

        <form id="loginForm" action="index.html" method="GET">
            <div class="input-group">
                <label for="username">Astronaut ID / Mission Specialist</label>
                <input type="text" id="username" name="username" placeholder="Enter ID..." required>
            </div>

            <div class="input-group">
                <label for="password">Security Clearance Key</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">Access Dashboard</button>
        </form>
    </div>

    <div class="team-footer">
        <span class="team-name">Developed by</span>
        <img src="c:\Users\salma\Downloads\space_care_crew-removebg-preview.png" alt="Team Logo" class="team-logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="team-badge-fallback">TEAM</div>
    </div>

   <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const loginBtn = document.querySelector('.login-btn');
            
            loginBtn.style.backgroundColor = '#00ff66';
            loginBtn.style.color = '#000';
            loginBtn.innerText = 'VERIFYING CLEARANCE...';

            setTimeout(() => { window.location.href = 'index.html'; }, 800);
        });
    </script>
</body>
</html>
